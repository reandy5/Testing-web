    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
        import { getRemoteConfig, fetchAndActivate, getString } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-remote-config.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClZySQiEZiZV5d7ASBSrXQvvClPBuzodw",
            authDomain: "testingtracker-2d31c.firebaseapp.com",
            databaseURL: "https://testingtracker-2d31c.firebaseio.com",
            projectId: "testingtracker-2d31c",
            storageBucket: "testingtracker-2d31c.firebasestorage.app",
            messagingSenderId: "776984139886",
            appId: "1:776984139886:web:904852ae2d510f03ecae7f",
            measurementId: "G-SCQMLR639K"
        };

        // 1. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const remoteConfig = getRemoteConfig(app);
        
        // 2. Konfigurasi Fetch (0 detik cache untuk testing)
        remoteConfig.settings.minimumFetchIntervalMillis = 0;

        // Mendefinisikan fungsi pengiriman dataLayer agar rapi
        const sendToGTM = (variantName) => {
            console.log("🚀 Mengirim ke DataLayer:", variantName);
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                'event': 'firebase_ready',
                'experiment_variant': variantName
            });
        };

        // 3. Eksekusi Fetch
        fetchAndActivate(remoteConfig)
            .then(() => {
                // Mengambil parameter sesuai dashboard Firebase Anda
                const variant = getString(remoteConfig, "floating_banner_type") || "hidden";
                console.log("🔥 Firebase Remote Config Berhasil. Variant:", variant);
                sendToGTM(variant);
            })
            .catch((err) => {
                console.error("❌ Firebase Gagal (Storage Error/Network):", err);
                
                // FALLBACK: Jika Firebase gagal (seperti error IndexedDB di konsol Anda),
                // kita paksa kirim varian 'banner_promo_1' agar GTM tetap bisa tertrigger untuk testing.
                console.log("⚠️ Menjalankan Fallback untuk testing GTM...");
                sendToGTM('banner_promo_1');
            });
    </script>
